<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>טל המלך – תהליך</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="process-page">

  <main class="process">

    <!--
      כדי להוסיף רשומה חדשה: העתיקו את התבנית הזו לסוף הרשימה (לפני </ol>).
      המספר מתווסף לבד.

      <li class="entry">
        <h2 class="entry__title">כותרת הרשומה</h2>

        (אם יש דימויים:)
        <div class="entry__groups">
          <div class="image-group">
            <p class="image-group__letter">A</p>
            <img src="images/שם-הקובץ.png" alt="תיאור קצר של הדימוי">
          </div>
        </div>
      </li>
    -->
    <ol class="process-list">

      <!-- רשומה 1 -->
      <li class="entry">
        <h2 class="entry__title">העלתי עמוד בקרוב</h2>
      </li>

      <!-- רשומה 2 -->
      <li class="entry">
        <h2 class="entry__title">שני כיוונים</h2>

        <div class="entry__groups">
          <div class="image-group">
            <p class="image-group__letter">A</p>
            <img src="images/process-a-1.png" alt="כיוון A: עמוד הבית עם תפריט הפרויקטים">
            <img src="images/process-a-2.png" alt="כיוון A: עמוד הפרויקט Wikipedia&gt;Football">
          </div>

          <div class="image-group">
            <p class="image-group__letter">B</p>
            <img src="images/process-b-1.png" alt="כיוון B: עמוד הבית עם הכיתוב TAL MAKES DESIGNS">
          </div>

          <div class="image-group">
            <p class="image-group__letter">C</p>
            <img src="images/process-c-1.png" alt="כיוון C: עמוד פרויקט על Football">
            <img src="images/process-c-2.png" alt="כיוון C: עמוד הפרויקט Darom Film Festival">
            <img src="images/process-c-3.png" alt="כיוון C: רשימת הפרויקטים">
          </div>
        </div>
      </li>

    </ol>

  </main>

</body>
</html>
