<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>טל המלך</title>
  <link rel="stylesheet" href="styles.css?v=127">
  <!-- חוזרים מעמוד פרויקט? העמוד מתחיל באמצע הגלילה (הסקריפט בסוף העמוד ממשיך את המעבר) -->
  <script>
    if (sessionStorage.getItem("return-home")) {
      document.documentElement.classList.add("is-returning");
    } else if (window.matchMedia("(max-width: 900px), (orientation: portrait)").matches &&
               !window.matchMedia("(prefers-reduced-motion: reduce)").matches &&
               !(document.referrer && new URL(document.referrer).origin === location.origin)) {
      // בטלפון: אנימציית פתיחה, רק כשנכנסים לאתר (לא כשחוזרים מעמוד של פרויקט).
      // בהתחלה המסך ריק (הסקריפט בסוף העמוד ממשיך)
      document.documentElement.classList.add("is-intro", "is-intro-list");
    }
  </script>
</head>
<body>

  <!-- עמוד הבית: שם, קו אנכי ורשימת פרויקטים (הטקסט באנגלית, לכן משמאל לימין) -->
  <main class="home" dir="ltr">

    <!-- הכותרת -->
    <header class="home-header">
      <h1 class="home-name" data-project="about" tabindex="0"><span class="home-name__latin">TAL</span><span class="home-name__mark">∅</span><span class="home-name__hebrew" lang="he">טל</span></h1>
      <p class="home-about" tabindex="0"><span class="home-about__text">Ab0Ut &amp; C0NtACT</span><span class="home-arrow"><img src="images/home-arrow.svg" alt=""></span></p>
    </header>

    <!-- האזור שבאמצע: הקו, ובמצב hover התמונה של הפרויקט -->
    <div class="home-line">
      <img class="home-line__line" src="images/home-line.svg" alt="">

      <!-- התריס: חלון אחד לכל התמונות, נפתח במצב hover על השם או על פרויקט -->
      <div class="preview-area">
        <div class="preview-window">
          <div class="preview-window__images">
            <img data-project="about" src="images/about-tal.png" alt="טל המלך">
            <img data-project="view" src="images/project-view.png" alt="VIEW">
            <img data-project="chick-check" src="images/project-chick-check.png" alt="CHICK-CHECK">
            <img data-project="hed-artzi" src="images/project-hed-artzi.png" alt="HED ARTZI REBRANDING">
            <img data-project="wikipedia-football" src="images/project-wikipedia-football.png" alt="WIKIPEDIA>FOOTBALL">
            <img data-project="darom" src="images/project-darom.png" alt="DAROM FILM FESTIVAL">
          </div>
        </div>
      </div>
    </div>

    <!--
      הפרויקטים. פרויקט שיש לו עמוד: השם והעיגול עטופים בקישור (<a>).
      לפרויקטים שעוד אין להם עמוד אין קישור.
      לכל פרויקט: שם, ועיגול שמתרחב במצב hover ומציג תווית.
      ה-data-project מחבר בין הפרויקט לתמונה שלו למעלה.
    -->
    <ul class="project-list">
      <li class="project" data-project="view" tabindex="0">
        <span class="project__name">VIEW</span>
        <span class="project__tag"><span class="project__tag-text">UX/UI</span></span>
      </li>
      <li class="project" data-project="chick-check" tabindex="0">
        <span class="project__name">CHICK-CHECK</span>
        <span class="project__tag"><span class="project__tag-text">UX/UI</span></span>
      </li>
      <li class="project" data-project="hed-artzi">
        <a class="project__link" href="hed-artzi.html">
          <span class="project__name">HED ARTZI REBRANDING</span>
          <span class="project__tag"><span class="project__tag-text">BRAND</span></span>
        </a>
      </li>
      <li class="project" data-project="wikipedia-football">
        <a class="project__link" href="wikipedia-football.html">
          <span class="project__name">WIKIPEDIA&gt;F00TBALL</span>
          <span class="project__tag"><span class="project__tag-text">BRAND</span></span>
        </a>
      </li>
      <li class="project" data-project="darom">
        <a class="project__link" href="darom.html">
          <span class="project__name">DAR0M FILM FESTIVAL</span>
          <span class="project__tag"><span class="project__tag-text">BRAND</span></span>
        </a>
      </li>
    </ul>

  </main>

  <!--
    התריס: כשמצביעים על השם או על פרויקט, החלון נפתח ומציג את התמונה שלו.
    במעבר ישיר מפרויקט לפרויקט החלון לא נסגר, רק משנה את הרוחב.
    כשיוצאים, החלון נסגר אבל התמונה האחרונה נשארת בו עד שהוא סגור.
  -->
  <script>
    const previewWindow = document.querySelector(".preview-window");
    const previewTriggers = document.querySelectorAll(".home-name, .project");
    let hoveredTrigger = null;
    let autoTrigger = null; // בטלפון: מה שמוצג עכשיו במעבר האוטומטי (ראו למטה)

    // מה להציג עכשיו: מה שהעכבר עליו, ואם אין, מה שנבחר בלחיצה (בטלפון)
    function updatePreview() {
      const focusedTrigger = [...previewTriggers].find((trigger) => trigger.contains(document.activeElement));
      const activeTrigger = hoveredTrigger || focusedTrigger || autoTrigger;

      if (activeTrigger) {
        previewWindow.dataset.showing = activeTrigger.dataset.project;
        previewWindow.classList.add("is-open");
      } else {
        previewWindow.classList.remove("is-open");
      }
    }

    previewTriggers.forEach((trigger) => {
      trigger.addEventListener("mouseenter", () => {
        hoveredTrigger = trigger;
        updatePreview();
      });
      trigger.addEventListener("mouseleave", () => {
        if (hoveredTrigger === trigger) hoveredTrigger = null;
        updatePreview();
      });
      trigger.addEventListener("focusin", updatePreview);
      trigger.addEventListener("focusout", () => setTimeout(updatePreview)); // אחרי שהפוקוס עבר
    });

    /*
      בטלפון (אין hover): העמוד עובר לבד בין הפרויקטים, אחד-אחד, מלמעלה למטה,
      ובסוף אל TAL∅ טל. השם נצבע, והתריס נפתח עם התמונה המתאימה. ואז מההתחלה.
    */
    const mobileLayout = window.matchMedia("(max-width: 900px), (orientation: portrait)");
    const autoOrder = [...document.querySelectorAll(".project"), document.querySelector(".home-name")];
    const autoStepTime = 1500; // כמה זמן כל פרויקט מוצג (מילישניות)
    let autoIndex = 0;
    let autoTimer = null;

    function showAutoStep() {
      if (autoTrigger) autoTrigger.classList.remove("is-auto");
      autoTrigger = autoOrder[autoIndex];
      autoTrigger.classList.add("is-auto");
      updatePreview();
      autoIndex = (autoIndex + 1) % autoOrder.length; // אחרי TAL חוזרים לפרויקט הראשון
    }

    function startAutoPreview() {
      if (autoTimer || !mobileLayout.matches || introRoot.classList.contains("is-intro-list")) return;
      autoIndex = 0;
      autoTimer = setTimeout(function step() {
        showAutoStep();
        autoTimer = setTimeout(step, autoStepTime);
      }, 800); // מתחילים רגע אחרי שהעמוד נטען
    }

    function stopAutoPreview() {
      clearTimeout(autoTimer);
      autoTimer = null;
      if (autoTrigger) autoTrigger.classList.remove("is-auto");
      autoTrigger = null;
      updatePreview();
    }

    /*
      אנימציית הפתיחה בטלפון (כמו המעבר בין העמודים במחשב):
      1. המסך ריק, והקו יורד מלמעלה עד למטה, לכל הגובה של המסך.
      2. ואז כאילו גוללים: הקצה העליון של הקו יורד למקום שלו, הקצה התחתון עולה,
         והשם יורד מלמעלה יחד איתו. כך "נוצר" המסך.
      3. כשהקו נעצר, הפרויקטים מופיעים אחד-אחד, ואז מתחיל המעבר האוטומטי ביניהם.
    */
    const introRoot = document.documentElement;
    const introDrawDuration = 1300;   // 1. הקו יורד עד למטה (מילישניות)
    const introScrollDuration = 1300; // 2. המסך נוצר
    const introListStart = 450;       // 3. הפרויקטים מתחילים לעלות כשהקו עוד מאט (אחרי 450 מתוך 1300)
    const introFadeDuration = 1360;   //    הם מופיעים אחד-אחד (4 × 140 ועוד 800, כמו ב-CSS)
    const easeInOut = "cubic-bezier(0.65, 0, 0.35, 1)"; // מתחיל לאט ונעצר לאט
    const easeOut = "cubic-bezier(0.22, 1, 0.36, 1)";   // ממשיך בתנופה ונעצר בעדינות

    if (introRoot.classList.contains("is-intro")) {
      const homeLineImage = document.querySelector(".home-line__line");
      const header = document.querySelector(".home-header");
      const lineBox = homeLineImage.getBoundingClientRect();
      const screenHeight = introRoot.clientHeight;
      const lineTopAbove = lineBox.top - screenHeight; // הקצה העליון: מעל המסך, בדיוק במרחק של מסך אחד

      // קו של המעבר (כמו במחשב), באותו מקום ובאותו עובי כמו הקו של העמוד
      const introLine = document.createElement("div");
      introLine.className = "page-line";
      introLine.style.left = lineBox.left + "px";
      introLine.style.width = lineBox.width + "px";
      introLine.style.transition = "none";
      document.body.append(introLine);

      // 1. הקו יורד מלמעלה עד הקצה התחתון של המסך
      introLine.animate(
        [
          { top: lineTopAbove + "px", height: -lineTopAbove + "px" },  // נגמר בראש המסך
          { top: lineTopAbove + "px", height: screenHeight - lineTopAbove + "px" } // נגמר בתחתית המסך
        ],
        { duration: introDrawDuration, easing: easeInOut, fill: "forwards" }
      );

      // 2. המסך נוצר: הקו מתכווץ למקום שלו, והשם יורד מלמעלה
      setTimeout(() => {
        introLine.animate(
          [
            { top: lineTopAbove + "px", height: screenHeight - lineTopAbove + "px" },
            { top: lineBox.top + "px", height: lineBox.height + "px" }
          ],
          { duration: introScrollDuration, easing: easeOut, fill: "forwards" }
        );
        header.animate(
          [{ transform: `translateY(${-screenHeight}px)` }, { transform: "none" }],
          { duration: introScrollDuration, easing: easeOut }
        );
        introRoot.classList.add("is-intro-scrolling"); // השם כבר לא מוסתר (האנימציה מזיזה אותו)
      }, introDrawDuration);

      // 3. הקו עוד נעצר בעדינות, והפרויקטים כבר מתחילים לעלות, כך שהכל זורם ברצף
      setTimeout(() => {
        introRoot.classList.remove("is-intro-list");
        setTimeout(startAutoPreview, introFadeDuration);
      }, introDrawDuration + introListStart);

      // הקו נעצר: הקו של העמוד חוזר במקום הקו של המעבר
      setTimeout(() => {
        introLine.remove();
        introRoot.classList.remove("is-intro", "is-intro-scrolling");
      }, introDrawDuration + introScrollDuration);
    } else {
      startAutoPreview();
    }

    /*
      בטלפון: השורה הכי ארוכה ממלאת את הרוחב, עם רווח מכל צד (--home-text-gutter ב-CSS).
      כאן מודדים כמה היא רחבה בדפדפן הזה, כי בכל דפדפן הפונט קצת שונה.
    */
    function measureLongestRow() {
      if (!mobileLayout.matches) return;
      const homePage = document.querySelector(".home");
      const u = parseFloat(getComputedStyle(homePage).fontSize) / 80.4; // גודל הטקסט הוא 80.4 u
      let widest = 0;
      document.querySelectorAll(".project").forEach((project) => {
        const name = project.querySelector(".project__name").getBoundingClientRect();
        const tag = project.querySelector(".project__tag").getBoundingClientRect();
        widest = Math.max(widest, tag.right - name.left);
      });
      homePage.style.setProperty("--home-row-width", widest / u);
    }

    document.fonts.ready.then(measureLongestRow); // אחרי שהפונט נטען, כי הוא קובע את הרוחב
    mobileLayout.addEventListener("change", measureLongestRow);
    // נוגעים בפרויקט: המעבר האוטומטי עוצר, ומוצג מה שנגעו בו. כשיוצאים, הוא מתחיל שוב
    previewTriggers.forEach((trigger) => {
      trigger.addEventListener("focusin", stopAutoPreview);
      trigger.addEventListener("focusout", startAutoPreview);
    });
    // אם המסך מתחלף (למשל מסובבים את הטאבלט): מפעילים או עוצרים
    mobileLayout.addEventListener("change", () => (mobileLayout.matches ? startAutoPreview() : stopAutoPreview()));

    /*
      המעבר לעמוד פרויקט (רק במחשב, ורק אם לא ביקשו פחות תנועה), כאילו גוללים למטה לאורך הקו:
      1. התריס נסגר חזרה לקו, והרשימה נעלמת.
      2. המסך "יורד": הכותרת והקו עולים, והקו נמשך עד למטה.
      3. עוברים לעמוד הפרויקט, ושם הקו ממשיך והופך לקו המפריד.
    */
    const home = document.querySelector(".home");
    const homeLine = document.querySelector(".home-line__line");
    const shutterDuration = 600; // כמו --duration-shutter ב-CSS
    const scrollDuration = 600;  // כמו --duration-page-out ב-CSS
    const desktopLayout = window.matchMedia("(min-width: 901px) and (orientation: landscape)");
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

    document.querySelectorAll(".project__link").forEach((link) => {
      link.addEventListener("click", (event) => {
        if (!desktopLayout.matches || reducedMotion.matches) return; // מעבר רגיל
        event.preventDefault();
        leaveTo(link.href);
      });
    });

    function leaveTo(address) {
      // 1. התריס נסגר והרשימה נעלמת
      home.classList.add("is-leaving");
      hoveredTrigger = null;
      previewWindow.classList.remove("is-open");
      document.activeElement.blur();

      setTimeout(() => {
        // קו חדש בדיוק במקום של הקו של העמוד, שאותו אפשר להזיז ולמתוח
        const lineBox = homeLine.getBoundingClientRect();
        const screenHeight = document.documentElement.clientHeight; // הגובה של החלון
        const pageLine = document.createElement("div");
        pageLine.className = "page-line";
        pageLine.style.left = lineBox.left + "px";
        pageLine.style.width = lineBox.width + "px";
        pageLine.style.top = lineBox.top + "px";
        pageLine.style.height = lineBox.height + "px";
        document.body.append(pageLine);
        homeLine.style.visibility = "hidden";
        pageLine.offsetHeight; // (הדפדפן מצייר את הקו לפני שהוא זז)

        // 2. גוללים מסך שלם למטה: הכותרת והקצה העליון של הקו עולים ויוצאים, והקו נמשך עד למטה
        home.style.setProperty("--scroll-distance", screenHeight + "px");
        home.classList.add("is-scrolling");
        pageLine.style.top = lineBox.top - screenHeight + "px";
        pageLine.style.height = 2 * screenHeight - lineBox.top + "px"; // הקצה התחתון: בתחתית המסך

        // 3. עמוד הפרויקט ימשיך מאותו קו (שומרים איפה הוא)
        setTimeout(() => {
          sessionStorage.setItem("enter-line", JSON.stringify({ left: lineBox.left, width: lineBox.width }));
          window.location.href = address;
        }, scrollDuration);
      }, shutterDuration);
    }

    /*
      חוזרים מעמוד פרויקט: אותה גלילה, הפוך.
      הקו מתחיל לכל הגובה, והכותרת למעלה מחוץ למסך. שניהם יורדים למקום שלהם,
      ואז הרשימה מופיעה.
    */
    const homeRoot = document.documentElement;
    const comeBackDuration = 1000; // כמו --duration-page-in ב-CSS

    if (homeRoot.classList.contains("is-returning")) {
      sessionStorage.removeItem("return-home"); // ברענון של העמוד המעבר לא חוזר
      const lineBox = homeLine.getBoundingClientRect();
      const screenHeight = homeRoot.clientHeight;

      // הקו של המעבר: מתחיל במקום שבו נגמרה הגלילה בעמוד הפרויקט (לכל הגובה)
      const pageLine = document.createElement("div");
      pageLine.className = "page-line";
      pageLine.style.left = lineBox.left + "px";
      pageLine.style.width = lineBox.width + "px";
      pageLine.style.top = lineBox.top - screenHeight + "px";
      pageLine.style.height = 2 * screenHeight - lineBox.top + "px";
      document.body.append(pageLine);

      requestAnimationFrame(() => requestAnimationFrame(() => {
        homeRoot.classList.add("is-coming-back");
        homeRoot.classList.remove("is-returning");
        pageLine.style.top = lineBox.top + "px";
        pageLine.style.height = lineBox.height + "px";
      }));

      // בסוף: הקו של העמוד חוזר למקום של הקו של המעבר, והרשימה מופיעה
      setTimeout(() => {
        homeRoot.classList.remove("is-coming-back");
        pageLine.remove();
      }, comeBackDuration);
    }

    // חזרה לעמוד הבית בכפתור "אחורה" של הדפדפן: העמוד חוזר למצב הרגיל
    window.addEventListener("pageshow", (event) => {
      if (!event.persisted) return;
      home.classList.remove("is-leaving", "is-scrolling");
      homeLine.style.visibility = "";
      document.querySelectorAll(".page-line").forEach((line) => line.remove());
    });
  </script>

  <!-- העכבר של האתר: עיגול לבן שנהיה ירוק על דברים לחיצים -->
  <script src="cursor.js?v=3"></script>

</body>
</html>
