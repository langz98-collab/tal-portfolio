<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HED ARTZI – טל המלך</title>
  <link rel="stylesheet" href="styles.css?v=49">
  <!-- מגיעים מעמוד הבית? הקו מתחיל איפה שהקו של עמוד הבית נגמר (gate.js ממשיך את המעבר) -->
  <script>
    {
      const enterLine = JSON.parse(sessionStorage.getItem("enter-line") || "null");
      const desktopLayout = window.matchMedia("(min-width: 901px) and (orientation: landscape)").matches;
      if (enterLine && desktopLayout) {
        const root = document.documentElement;
        root.classList.add("is-entering");
        root.style.setProperty("--enter-line-left", enterLine.left + "px");
        root.style.setProperty("--enter-line-width", enterLine.width + "px");
      }
    }
  </script>
</head>
<body class="theme-hed-artzi">

  <!--
    השער של הד ארצי: לפני שנכנסים לפרויקט צריך להגיד את הסיסמה (INDUSTRIAL PEACE) למיקרופון.
    הלוגו זז לפי הקול. כשהסיסמה נאמרת, הקו נדחף ימינה ופותח את עמוד הפרויקט.
    החץ שבצד ימין למעלה נכנס גם בלי סיסמה (למי שאין מיקרופון).
  -->
  <main class="gate">

    <!-- חזרה לעמוד הבית: כמו בעמוד פרויקט, במצב hover השם מתחלף ל-HOME -->
    <header class="gate-header project-header">
      <a class="project-home" href="index.html" aria-label="חזרה לעמוד הבית">
        <span class="project-header__back"><span class="project-header__back-icon"></span></span>
        <h1 class="project-header__title">
          <span class="project-header__name">HED ARTZI</span>
          <span class="project-header__home" aria-hidden="true">HOME</span>
        </h1>
      </a>
    </header>

    <!-- כניסה לפרויקט בלי סיסמה -->
    <a class="gate-skip" href="hed-artzi.html" aria-label="כניסה לפרויקט">
      <span class="project-next__icon"></span>
    </a>

    <!-- הקו (בשער הוא בצד שמאל, ובכניסה לפרויקט הוא נדחף למקום שלו באמצע) -->
    <img class="gate-line" src="images/home-line.svg" alt="">

    <!-- הלוגו שמגיב לקול. הכפתור של המיקרופון נמצא מתחתיו, ב-gate-mic -->
    <div class="hed-voice gate-voice" data-mic-slot=".gate-mic"></div>

    <div class="gate-text">
      <div class="gate-mic"></div>
      <p>SAY THE PASSWORD TO PASS</p>
      <p class="gate-text__word">INDUSTRIAL PEACE</p>
    </div>

  </main>

  <!--
    המרקם של הסיסמה (כמו ה-Texture בפיגמה):
    רעש אקראי (feTurbulence) מזיז קצת את הקצוות של האותיות (feDisplacementMap), כך שהן נראות מחוספסות.
    המרקם מתחזק ונחלש לאט, על כל המילים באותה מידה (animate), כדי להקשות טיפה על הקריאה:
    עדין: radius 1.9 בפיגמה (scale 3.8). חזק: radius 6.5 בפיגמה (scale 13).
    ככל שהמרקם חזק יותר, הטקסט גם שקוף יותר (feFuncA: מ-100% ל-60%).
    גודל הגרעינים לא משתנה, כדי שהשינוי יהיה על הכל ביחד (ולא "יזחל" משמאל לימין).
    כל סיבוב לוקח 5 שניות, בתנועה רכה כמו גל (keySplines: ease-in-out של סינוס).
  -->
  <svg class="gate-filters" width="0" height="0" aria-hidden="true">
    <filter id="gate-texture" x="-5%" y="-20%" width="110%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.5" numOctaves="1" seed="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.8" xChannelSelector="R" yChannelSelector="G" result="rough">
        <animate attributeName="scale" values="3.8;13;3.8" dur="5s" repeatCount="indefinite"
                 calcMode="spline" keyTimes="0;0.5;1" keySplines="0.37 0 0.63 1;0.37 0 0.63 1"/>
      </feDisplacementMap>
      <feComponentTransfer in="rough">
        <feFuncA type="linear" slope="1">
          <animate attributeName="slope" values="1;0.6;1" dur="5s" repeatCount="indefinite"
                   calcMode="spline" keyTimes="0;0.5;1" keySplines="0.37 0 0.63 1;0.37 0 0.63 1"/>
        </feFuncA>
      </feComponentTransfer>
    </filter>
  </svg>

  <!-- הלוגו שמגיב לקול -->
  <script src="hed-voice.js?v=6"></script>

  <!-- השער: זיהוי הסיסמה והמעברים -->
  <script src="gate.js?v=4"></script>

  <!-- העכבר של האתר: עיגול לבן שנהיה צבעוני על דברים לחיצים -->
  <script src="cursor.js?v=3"></script>

</body>
</html>
